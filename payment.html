<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DiserUc Service — Buyurtma</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#07110d;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#08140f;
    border-bottom:1px solid #193d2c;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#23e681;
}

.back{
    color:#9bb1a4;
    text-decoration:none;
    font-size:14px;
}

.back:hover{
    color:#23e681;
}

main{
    width:min(600px,calc(100% - 30px));
    margin:40px auto 70px;
}

.card{
    background:#0b1b13;
    border:1px solid #1b4932;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

h1{
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#81998c;
    font-size:14px;
    margin-bottom:25px;
}

.product{
    padding:18px;
    border-radius:15px;
    background:#07150e;
    border:1px solid #183d2b;
    margin-bottom:24px;
}

.product-name{
    color:#23e681;
    font-size:24px;
    font-weight:900;
}

.product-country{
    color:#91a99b;
    margin-top:6px;
    font-size:13px;
}

.price{
    margin-top:15px;
    font-size:25px;
    font-weight:900;
}

label{
    display:block;
    color:#a9bdb1;
    font-size:13px;
    margin:16px 0 7px;
}

input{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #244b36;
    outline:none;
    background:#07110d;
    color:#fff;
    font-size:15px;
}

input:focus{
    border-color:#23e681;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#23e681;
    color:#03150c;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.08);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:#35151a;
    border:1px solid #69303a;
    color:#ffadb5;
}

.message.success{
    display:block;
    background:#0d3321;
    border:1px solid #1e6942;
    color:#8cffbc;
}

.loading{
    text-align:center;
    padding:45px 10px;
    color:#829a8c;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Diser<span>Uc</span> Service
    </div>

    <a href="products.html" class="back">
        ← Paketlar
    </a>

</header>


<main>

    <div id="loading" class="loading">
        Buyurtma ma'lumotlari yuklanmoqda...
    </div>


    <section id="paymentCard" class="card hidden">

        <h1>Buyurtma berish</h1>

        <p class="subtitle">
            PUBG Mobile akkauntingiz ma'lumotlarini kiriting.
        </p>


        <div class="product">

            <div
                id="productName"
                class="product-name">
                —
            </div>

            <div
                id="countryName"
                class="product-country">
                —
            </div>

            <div
                id="productPrice"
                class="price">
                —
            </div>

        </div>


        <form id="orderForm">

            <label for="playerId">
                PUBG Player ID
            </label>

            <input
                id="playerId"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Masalan: 5123456789"
                maxlength="30"
                required
            >


            <label for="nickname">
                PUBG Nickname
            </label>

            <input
                id="nickname"
                type="text"
                autocomplete="off"
                placeholder="Nickname"
                maxlength="50"
                required
            >


            <button
                id="orderButton"
                type="submit">

                Buyurtma berish
            </button>

        </form>


        <div id="message" class="message"></div>

    </section>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://iwfgmwyzhtcjqwcbcqti.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_xuMg-m94o144YvaxkQNDSg_R94pt5JY";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   URL
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const priceId =
    params.get("price");

const countryId =
    params.get("country");


/* =========================================
   ELEMENTS
========================================= */

const loading =
    document.getElementById("loading");

const paymentCard =
    document.getElementById("paymentCard");

const productName =
    document.getElementById("productName");

const countryName =
    document.getElementById("countryName");

const productPrice =
    document.getElementById("productPrice");

const orderForm =
    document.getElementById("orderForm");

const orderButton =
    document.getElementById("orderButton");

const message =
    document.getElementById("message");


/* =========================================
   HELPERS
========================================= */

function showMessage(text,type){

    message.className =
        "message " + type;

    message.textContent =
        text;

}


function formatPrice(value){

    return Number(value)
        .toLocaleString("en-US");

}


function escapeText(value){

    return String(value);

}


/* =========================================
   LOAD ORDER INFORMATION
========================================= */

async function loadOrderData(){

    if(!priceId || !countryId){

        loading.textContent =
            "Buyurtma ma'lumotlari topilmadi.";

        return;

    }


    /* Login tekshiruvi */

    const {
        data: authData
    } =
        await db.auth.getUser();


    if(
        !authData ||
        !authData.user
    ){

        loading.innerHTML =
            `
            <div>
                Buyurtma berish uchun
                avval tizimga kiring.
                <br><br>

                <a
                    href="login.html"
                    style="
                        color:#23e681;
                        text-decoration:none;
                        font-weight:900;
                    "
                >
                    Login qilish →
                </a>
            </div>
            `;

        return;

    }


    /*
       country_prices'dan tanlangan
       narxni olamiz.
    */

    const {
        data: priceData,
        error: priceError
    } =
        await db
        .from("country_prices")
        .select(`
            id,
            country_id,
            currency,
            price,
            bonus_uc,
            status,
            uc_products (
                id,
                name,
                amount
            ),
            countries (
                id,
                name,
                flag,
                currency
            )
        `)
        .eq("id",priceId)
        .eq("country_id",countryId)
        .eq("status","active")
        .single();


    if(priceError){

        console.error(priceError);

        loading.textContent =
            "Paket ma'lumotlarini olishda xatolik.";

        return;

    }


    if(!priceData){

        loading.textContent =
            "Paket topilmadi.";

        return;

    }


    if(!priceData.uc_products){

        loading.textContent =
            "UC mahsuloti topilmadi.";

        return;

    }


    if(!priceData.countries){

        loading.textContent =
            "Davlat ma'lumotlari topilmadi.";

        return;

    }


    /* UI */

    productName.textContent =
        "💎 " +
        Number(
            priceData.uc_products.amount
        ).toLocaleString() +
        " UC";


    countryName.textContent =
        (priceData.countries.flag || "🌍") +
        " " +
        escapeText(
            priceData.countries.name
        );


    productPrice.textContent =
        formatPrice(
            priceData.price
        ) +
        " " +
        priceData.currency;


    /*
       Keyinchalik submit vaqtida
       yana database'dan tekshirish uchun
       obyektni saqlaymiz.
    */

    window.selectedPrice =
        priceData;


    loading.classList.add("hidden");

    paymentCard.classList.remove("hidden");

}


/* =========================================
   CREATE ORDER
========================================= */

orderForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!window.selectedPrice){

            showMessage(
                "Paket ma'lumotlari topilmadi.",
                "error"
            );

            return;

        }


        const playerId =
            document
            .getElementById("playerId")
            .value
            .trim();


        const nickname =
            document
            .getElementById("nickname")
            .value
            .trim();


        if(playerId.length < 3){

            showMessage(
                "Player ID noto'g'ri.",
                "error"
            );

            return;

        }


        if(nickname.length < 2){

            showMessage(
                "Nickname noto'g'ri.",
                "error"
            );

            return;

        }


        orderButton.disabled = true;

        orderButton.textContent =
            "Buyurtma yaratilmoqda...";


        /*
           Login userni olamiz.
        */

        const {
            data: authData,
            error: authError
        } =
            await db.auth.getUser();


        if(
            authError ||
            !authData.user
        ){

            showMessage(
                "Sessiya tugagan. Qayta login qiling.",
                "error"
            );

            orderButton.disabled = false;

            orderButton.textContent =
                "Buyurtma berish";

            return;

        }


        const user =
            authData.user;


        const selected =
            window.selectedPrice;


        /*
           Orderni pending holatda yaratamiz.
        */

        const {
            data: order,
            error
        } =
            await db
            .from("orders")
            .insert({

                user_id:
                    user.id,

                country_price_id:
                    selected.id,

                player_id:
                    playerId,

                amount:
                    selected.uc_products.amount,

                price:
                    selected.price,

                status:
                    "pending"

            })
            .select("id")
            .single();


        if(error){

            console.error(error);

            showMessage(
                "Buyurtma yaratilmadi: " +
                error.message,
                "error"
            );

            orderButton.disabled = false;

            orderButton.textContent =
                "Buyurtma berish";

            return;

        }


        showMessage(
            "Buyurtma yaratildi! Order ID: " +
            order.id +
            ". Keyingi bosqichda to'lovga o'tamiz.",
            "success"
        );


        orderButton.disabled = true;

        orderButton.textContent =
            "Buyurtma yaratildi ✓";


        /*
           Payment sahifasini keyin ulaymiz.
        */

    }
);


/* =========================================
   START
========================================= */

loadOrderData();

</script>

</body>
  </html>

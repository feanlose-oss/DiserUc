<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DiserUc — To‘lov</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#07110d;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#08140f;
    border-bottom:1px solid #193d2c;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#23e681;
}

.back{
    color:#9bb1a4;
    text-decoration:none;
    font-size:14px;
}

.back:hover{
    color:#23e681;
}

main{
    width:min(600px,calc(100% - 30px));
    margin:40px auto 70px;
}

.card{
    background:#0b1b13;
    border:1px solid #1b4932;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

h1{
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#81998c;
    font-size:14px;
    margin-bottom:25px;
}

.order-box{
    background:#07150e;
    border:1px solid #183d2b;
    border-radius:15px;
    padding:18px;
    margin-bottom:25px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:9px 0;
    border-bottom:1px solid #173225;
}

.row:last-child{
    border-bottom:0;
}

.label{
    color:#829a8c;
    font-size:13px;
}

.value{
    text-align:right;
    font-weight:800;
}

.amount{
    color:#23e681;
    font-size:24px;
}

.methods-title{
    font-size:16px;
    font-weight:900;
    margin-bottom:12px;
}

.methods{
    display:grid;
    gap:10px;
}

.method{
    width:100%;
    padding:16px;
    border-radius:13px;
    border:1px solid #244b36;
    background:#07110d;
    color:#fff;
    cursor:pointer;
    text-align:left;
    font-size:15px;
    font-weight:800;
    transition:.15s;
}

.method:hover{
    border-color:#23e681;
    background:#0b2117;
}

.method.selected{
    border-color:#23e681;
    box-shadow:0 0 0 1px #23e681;
}

.method small{
    display:block;
    color:#81998c;
    font-size:11px;
    margin-top:4px;
    font-weight:400;
}

.pay-button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#23e681;
    color:#03150c;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
}

.pay-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    background:#35151a;
    border:1px solid #69303a;
    color:#ffadb5;
}

.message.success{
    display:block;
    background:#0d3321;
    border:1px solid #1e6942;
    color:#8cffbc;
}

.loading{
    text-align:center;
    padding:45px 10px;
    color:#829a8c;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Diser<span>Uc</span> Service
    </div>

    <a href="products.html" class="back">
        ← Paketlar
    </a>

</header>

<main>

    <div id="loading" class="loading">
        To‘lov ma'lumotlari yuklanmoqda...
    </div>

    <section id="paymentCard" class="card hidden">

        <h1>To‘lov</h1>

        <p class="subtitle">
            Buyurtmangiz uchun to‘lov usulini tanlang.
        </p>

        <div class="order-box">

            <div class="row">
                <span class="label">Order ID</span>
                <span id="orderId" class="value">—</span>
            </div>

            <div class="row">
                <span class="label">PUBG Player ID</span>
                <span id="playerId" class="value">—</span>
            </div>

            <div class="row">
                <span class="label">UC</span>
                <span id="ucAmount" class="value amount">—</span>
            </div>

            <div class="row">
                <span class="label">To‘lov summasi</span>
                <span id="price" class="value">—</span>
            </div>

        </div>

        <div class="methods-title">
            To‘lov usulini tanlang
        </div>

        <div class="methods">

            <button
                class="method"
                data-provider="click">

                🟢 Click

                <small>
                    Click orqali to‘lash
                </small>

            </button>

            <button
                class="method"
                data-provider="payme">

                🔵 Payme

                <small>
                    Payme orqali to‘lash
                </small>

            </button>

            <button
                class="method"
                data-provider="uzum">

                🟣 Uzum

                <small>
                    Uzum orqali to‘lash
                </small>

            </button>

            <button
                class="method"
                data-provider="stripe">

                💳 Stripe

                <small>
                    Bank karta orqali to‘lash
                </small>

            </button>

        </div>

        <button
            id="payButton"
            class="pay-button"
            disabled>

            To‘lovga o‘tish
        </button>

        <div id="message" class="message"></div>

    </section>

</main>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://iwfgmwyzhtcjqwcbcqti.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_xuMg-m94o144YvaxkQNDSg_R94pt5JY";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   URL
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const orderId =
    params.get("order");


/* =========================================
   ELEMENTS
========================================= */

const loading =
    document.getElementById("loading");

const paymentCard =
    document.getElementById("paymentCard");

const orderIdEl =
    document.getElementById("orderId");

const playerIdEl =
    document.getElementById("playerId");

const ucAmountEl =
    document.getElementById("ucAmount");

const priceEl =
    document.getElementById("price");

const payButton =
    document.getElementById("payButton");

const message =
    document.getElementById("message");

const methodButtons =
    document.querySelectorAll(".method");


let selectedProvider = null;
let selectedOrder = null;


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    "Buyurtma yaratildi! To‘lov sahifasiga o‘tilmoqda...",
    "success"
);

orderButton.disabled = true;

orderButton.textContent =
    "To‘lovga o‘tilmoqda...";


/*
   Payment sahifasiga avtomatik o'tish
*/

setTimeout(function(){

    window.location.href =
        "payment.html?order=" +
        encodeURIComponent(order.id);

}, 800);

}


/* =========================================
   LOAD ORDER
========================================= */

async function loadOrder(){

    if(!orderId){

        loading.textContent =
            "Order ID topilmadi.";

        return;

    }


    const {
        data: authData,
        error: authError
    } =
        await db.auth.getUser();


    if(
        authError ||
        !authData ||
        !authData.user
    ){

        loading.innerHTML = `
            Buyurtmani ko‘rish uchun
            avval login qiling.
            <br><br>

            <a
                href="login.html"
                style="
                    color:#23e681;
                    text-decoration:none;
                    font-weight:900;
                "
            >
                Login qilish →
            </a>
        `;

        return;

    }


    const {
        data: order,
        error
    } =
        await db
        .from("orders")
        .select(`
            id,
            player_id,
            amount,
            price,
            status,
            user_id
        `)
        .eq("id",orderId)
        .eq("user_id",authData.user.id)
        .single();


    if(error){

        console.error(error);

        loading.textContent =
            "Buyurtmani olishda xatolik.";

        return;

    }


    if(!order){

        loading.textContent =
            "Buyurtma topilmadi.";

        return;

    }


    if(order.status !== "pending"){

        loading.textContent =
            "Bu buyurtma to‘lov uchun mavjud emas. Status: " +
            order.status;

        return;

    }


    selectedOrder = order;


    orderIdEl.textContent =
        order.id;

    playerIdEl.textContent =
        order.player_id;

    ucAmountEl.textContent =
        Number(order.amount).toLocaleString() +
        " UC";

    priceEl.textContent =
        Number(order.price).toLocaleString() +
        " UZS";


    loading.classList.add("hidden");

    paymentCard.classList.remove("hidden");

}


/* =========================================
   SELECT PAYMENT METHOD
========================================= */

methodButtons.forEach(function(button){

    button.addEventListener(
        "click",
        function(){

            methodButtons.forEach(function(item){

                item.classList.remove("selected");

            });


            button.classList.add("selected");


            selectedProvider =
                button.dataset.provider;


            payButton.disabled = false;

        }
    );

});


/* =========================================
   PAYMENT
========================================= */

payButton.addEventListener(
    "click",
    async function(){

        if(!selectedOrder){

            showMessage(
                "Buyurtma topilmadi.",
                "error"
            );

            return;

        }


        if(!selectedProvider){

            showMessage(
                "To‘lov usulini tanlang.",
                "error"
            );

            return;

        }


        payButton.disabled = true;

        payButton.textContent =
            "Payment tayyorlanmoqda...";


        const {
            data: authData,
            error: authError
        } =
            await db.auth.getUser();


        if(
            authError ||
            !authData ||
            !authData.user
        ){

            showMessage(
                "Sessiya tugagan. Qayta login qiling.",
                "error"
            );

            payButton.disabled = false;

            payButton.textContent =
                "To‘lovga o‘tish";

            return;

        }


        /*
           Payment record yaratamiz.
        */

        const {
            data: payment,
            error
        } =
            await db
            .from("payments")
            .insert({

                order_id:
                    selectedOrder.id,

                user_id:
                    authData.user.id,

                provider:
                    selectedProvider,

                amount:
                    selectedOrder.price,

                currency:
                    "UZS",

                status:
                    "pending"

            })
            .select("id")
            .single();


        if(error){

            console.error(error);

            showMessage(
                "Payment yaratilmadi: " +
                error.message,
                "error"
            );

            payButton.disabled = false;

            payButton.textContent =
                "To‘lovga o‘tish";

            return;

        }


        /*
           Hozircha real gateway ulanmagan.
        */

        showMessage(
            "Payment yaratildi. Payment ID: " +
            payment.id +
            ". " +
            selectedProvider.toUpperCase() +
            " gateway keyingi bosqichda ulanadi.",
            "success"
        );


        payButton.textContent =
            "Payment yaratildi ✓";

    }
);


/* =========================================
   START
========================================= */

loadOrder();

</script>

</body>
  </html>
